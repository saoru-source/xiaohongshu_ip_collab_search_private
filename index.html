<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小紅書 IPコラボ検索キーワード集（プレビュー版）</title>
<style>
:root{
  --bg:#fff5f6; --card:#ffffff; --accent:#ff2442; --accent-dark:#d81b3f;
  --text:#26232a; --sub:#8a8a8a; --border:#f0d9dc; --chip:#fff0f1; --chip-hover:#ffe1e4;
  --header-h:64px; --sticky-h:170px;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:"Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text);
}
header{
  position:sticky; top:0; z-index:20; background:linear-gradient(135deg,#ff2442,#ff5470);
  color:#fff; padding:14px 20px; box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.02em;}
header p{margin:2px 0 0; font-size:12px; opacity:.9;}
.private-badge{
  display:inline-block; font-size:10px; font-weight:700; background:rgba(255,255,255,.28);
  padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle;
}
.preview-badge{
  display:inline-block; font-size:10px; font-weight:700; background:#26232a;
  color:#ffe1a8; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle;
}
.search-bar{
  position:sticky; top:var(--header-h); z-index:19; background:#fff; padding:12px 16px;
  border-bottom:1px solid var(--border); box-shadow:0 2px 6px rgba(0,0,0,.04);
}
.search-row{display:flex; flex-wrap:wrap; gap:6px; max-width:900px; margin:0 auto;}
.search-row #filterInput{flex-basis:100%;}
.search-row .icon-btn{flex:1 1 0;}
#filterInput{
  flex:1; min-width:0; padding:11px 12px; font-size:15px; border:2px solid var(--border);
  border-radius:10px; outline:none; transition:border-color .15s;
}
#filterInput:focus{border-color:var(--accent);}
.icon-btn{
  flex:0 0 auto; border:none; border-radius:10px; font-size:13px; font-weight:700;
  padding:0 11px; cursor:pointer; white-space:nowrap;
}
.icon-btn.search{background:var(--accent); color:#fff;}
.icon-btn.search:active{background:var(--accent-dark);}
.icon-btn.reset{background:#fff; color:var(--sub); border:1px solid var(--border);}
.icon-btn.reset:active{background:var(--chip-hover); color:var(--accent-dark);}
.icon-btn.copy{background:#fff; color:var(--accent-dark); border:1px solid #f6b8bf;}
.icon-btn.copy:active{background:var(--chip); color:var(--accent-dark);}
.count-badge{
  font-size:11px; color:var(--sub); margin:6px auto 0; max-width:900px; padding:0 2px;
}
.translation-hint{
  font-size:11px; color:var(--sub); margin:4px auto 0; max-width:900px; padding:0 2px; min-height:14px;
}
.variant-toggle{
  display:flex; align-items:center; gap:6px; max-width:900px; margin:6px auto 0; padding:0 2px;
}
.variant-label{font-size:11px; color:var(--sub);}
.variant-btn{
  font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
  border:1px solid var(--border); background:#fff; color:var(--sub); cursor:pointer;
}
.variant-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.active-filter-chip{
  display:none; align-items:center; gap:6px; max-width:900px; margin:8px auto 0;
  background:#ffe9c2; border:1px solid #f0b95a; color:#7a5200; font-size:12px; font-weight:700;
  padding:6px 10px; border-radius:999px; width:fit-content;
}
.active-filter-chip.show{display:inline-flex;}
.active-filter-chip button{border:none; background:none; color:#7a5200; font-weight:700; cursor:pointer; font-size:13px; line-height:1;}
.quick-tags{max-width:900px; margin:8px auto 0; display:flex; flex-wrap:wrap; gap:6px;}
.quick-tags button{
  font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--border);
  background:#fff; color:var(--sub); cursor:pointer;
}
.quick-tags button:hover{background:var(--chip); color:var(--accent-dark);}
.toolbar-extra{padding:0 16px;}
.combo-hint{max-width:900px; margin:8px auto 0; font-size:11px; color:var(--sub);}
.builder{
  max-width:900px; margin:14px auto 0; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px;
}
.builder-title{font-size:14px; font-weight:700; color:var(--accent-dark); margin:0 0 8px;}
.builder-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.builder select, .builder input[type=text]{
  padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:#fff;
}
.builder .preview{
  font-size:14px; font-weight:700; color:var(--text); background:var(--chip);
  padding:8px 12px; border-radius:8px; flex:1; min-width:160px;
}
.builder button.go{
  background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:8px;
  font-size:13px; font-weight:700; cursor:pointer;
}
.builder button.go:hover{background:var(--accent-dark);}
.combo-bar{max-width:900px; margin:0 auto; display:none;}
.combo-bar.show{display:block;}
.combo-inner{
  margin-top:12px; background:#fffaf0; border:1px solid #f0b95a; border-radius:12px; padding:12px 14px;
}
.combo-label{font-size:12px; font-weight:700; color:#7a5200;}
.combo-list{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
.combo-pill{
  display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #f0b95a;
  border-radius:999px; padding:4px 6px 4px 10px; font-size:12px; font-weight:700; color:#7a5200;
}
.combo-pill button{border:none; background:none; color:#a35a00; cursor:pointer; font-size:13px;}
.combo-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.combo-preview{font-size:13px; font-weight:700; flex:1; min-width:120px;}
.combo-actions button{
  border:none; border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;
}
#comboSearchBtn{background:var(--accent); color:#fff;}
#comboClearBtn{background:#fff; border:1px solid var(--border) !important; color:var(--sub);}
main{max-width:900px; margin:0 auto; padding:16px 16px 60px;}

/* ---- 階層カテゴリナビ ---- */
.nav-box{
  margin-bottom:14px; padding:14px 16px; background:#fff;
  border-radius:12px; border:1px solid var(--border);
}
.nav-label{font-size:14px; font-weight:700; color:var(--accent-dark); margin:0 0 10px;}
.group-list{display:flex; flex-direction:column; gap:8px;}
.group-btn{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  background:var(--chip); border:1px solid var(--border); border-radius:10px;
  padding:11px 14px; font-size:14px; font-weight:700; color:var(--text); cursor:pointer;
}
.group-btn:active{background:var(--chip-hover);}
.group-btn .arrow{transition:transform .15s; color:var(--accent-dark); font-size:12px;}
.group-btn.open .arrow{transform:rotate(90deg);}
.subcat-list{
  display:none; flex-wrap:wrap; gap:6px; padding:10px 4px 2px;
}
.subcat-list.open{display:flex;}
.subcat-list button{
  font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border);
  background:#fff; color:var(--accent-dark); cursor:pointer; font-weight:700;
}
.subcat-list button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

section.cat{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; scroll-margin-top:calc(var(--sticky-h) + 12px);
}
section.cat h2{
  font-size:14px; margin:0 0 4px; color:var(--accent-dark); display:flex; align-items:center; gap:6px;
}
section.cat .desc{font-size:12px; color:var(--sub); margin:0 0 10px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  position:relative; display:flex; flex-direction:column; align-items:flex-start;
  background:var(--chip); border:1px solid var(--border); border-radius:10px;
  padding:7px 10px 6px 10px; cursor:pointer; min-width:64px;
  transition:background .12s, transform .08s;
}
.chip:hover{background:var(--chip-hover); transform:translateY(-1px);}
.chip .primary{font-size:14px; font-weight:700; color:var(--text); line-height:1.3;}
.chip .secondary{font-size:11px; color:var(--sub); line-height:1.3; margin-top:1px;}
.chip .note{font-size:10px; color:#c98a00; margin-top:2px;}
.chip .tags{font-size:10px; color:var(--accent-dark); margin-top:2px;}
.chip .province{font-size:10px; color:var(--sub); margin-top:2px;}
.chip-actions{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; padding-top:6px;}
.chip-actions button{
  font-size:11px; cursor:pointer; white-space:nowrap;
  padding:3px 8px; border-radius:999px; background:#fff; border:1px solid var(--border);
  display:inline-flex; align-items:center; gap:3px; color:var(--sub);
}
.chip-actions .add-btn{color:var(--accent-dark); border-color:#f6b8bf; font-weight:700;}
.chip-actions .add-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip.in-combo{background:#ffe9c2; border-color:#f0b95a;}
.chip.copied .copy-btn{color:#fff; background:var(--accent); border-color:var(--accent);}
.chip.hidden{display:none;}
section.cat.priority-cat{
  border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,36,66,.12);
}
section.cat.hidden{display:none;}
.toggle-more-btn{
  display:block; margin:10px 0 0 auto; padding:7px 16px; font-size:12px; font-weight:700;
  color:var(--accent-dark); background:var(--chip); border:1px solid var(--border);
  border-radius:999px; cursor:pointer;
}
.toggle-more-btn:hover{background:var(--chip-hover);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#26232a; color:#fff; padding:9px 18px; border-radius:999px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:88vw; text-align:center;
}
.toast.show{opacity:1;}
footer{max-width:900px; margin:0 auto 30px; text-align:center; font-size:11px; color:var(--sub);}
.no-result{font-size:13px; color:var(--sub); text-align:center; padding:30px 0;}
</style>
</head>
<body>

<header>
<h1>🔎 小紅書(RED) IPコラボ検索キーワード集
  </h1>
</header>

<div class="search-bar">
  <div class="search-row">
    <input id="filterInput" type="text" placeholder="" autocomplete="off">
    <button class="icon-btn search" id="topSearchBtn">検索</button>
    <button class="icon-btn reset" id="topResetBtn">リセット</button>
    <button class="icon-btn copy" id="topCopyBtn">コピー</button>
  </div>
  <div class="translation-hint" id="translationHint"></div>
  <div class="count-badge" id="countBadge"></div>
  <div class="variant-toggle">
    <span class="variant-label">表記:</span>
    <button class="variant-btn active" id="variantSimpBtn" data-variant="simp">簡体字</button>
    <button class="variant-btn" id="variantTradBtn" data-variant="trad">繁体字</button>
  </div>
  <div class="active-filter-chip" id="activeFilterChip">
    <span id="activeFilterLabel"></span>
    <button id="activeFilterClearBtn" title="絞り込み解除">×</button>
  </div>
</div>

<div class="toolbar-extra">
  <p class="combo-hint">💡 各キーワードの「➕」で下の🧩複合キーワード欄に追加できます</p>
  <div class="builder">
    <div class="builder-title">🛠 月別まとめを調べる</div>
    <div class="builder-row">
      <select id="bIp"></select>
      <select id="bMonth"></select>
      <select id="bSuffix"></select>
      <div class="preview" id="bPreview">—</div>
    </div>
    <div class="builder-row" style="margin-top:8px;">
      <button class="icon-btn search" id="bSearchBtn">検索</button>
      <button class="icon-btn reset" id="bResetBtn">リセット</button>
      <button class="icon-btn copy" id="bCopyBtn">コピー</button>
    </div>
  </div>

  <div class="combo-bar" id="comboBar">
    <div class="combo-inner">
      <div class="combo-top"><span class="combo-label">🧩 組み立てた複合キーワード</span></div>
      <div class="combo-list" id="comboList"></div>
      <div class="combo-actions">
        <div class="combo-preview" id="comboPreview">—</div>
        <button id="comboSearchBtn">🔎 検索</button>
        <button id="comboClearBtn">クリア</button>
      </div>
    </div>
  </div>
</div>

<main>
  <nav class="nav-box">
    <p class="nav-label">📂 カテゴリから選ぶ</p>
    <div class="group-list" id="groupList"></div>
  </nav>

  <div id="catContainer"></div>
  <div class="no-result" id="noResult" style="display:none;">該当するキーワードが見つかりません</div>
</main>

<footer>キーワードはタップで小紅書アプリ(なければブラウザ)を開きます。※投稿の日付・時期は必ず現地の最新情報を確認してください。</footer>
<div class="toast" id="toast">コピーしました</div>

// ---- 簡体字 / 繁体字の表記切り替え ----
// zhフィールドは "简体字 / 繁体字" の形式で持っているものが多い（例: "赫敏·格兰杰 / 赫敏·格蘭傑"）。
// zhVariant が "trad" のときは "/" の後ろ側（繁体字）を優先的に使う。
let zhVariant = "simp";

function firstZh(zh){
  const parts = zh.split("/").map(s=> s.trim()).filter(Boolean);
  let chosen = parts[0] || zh;
  if(zhVariant === "trad" && parts.length > 1) chosen = parts[1];
  // 残りの区切り文字（全角スラッシュ・読点・カンマ・中点）でさらに1語目だけを取る
  return chosen.split(/[／、,・]/)[0].trim();
}

// ---- 端末判定（PC/デスクトップかスマホか） ----
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// ---- タップ時の検索処理 ----
// PC(デスクトップブラウザ)では、これまで通り小紅書のWeb検索結果ページを直接開く。
// スマホでは、Web版の検索結果ページが直接アクセスをブロックしてしまうため、
// アプリを開く処理とキーワードの自動コピーを組み合わせ、
// アプリが開いたら検索欄に貼り付けてもらう方式にする。
function openSearch(keyword){
  if(!keyword) return;
  const kw = firstZh(keyword);

  if(!isMobileDevice()){
    // PC版：ブラウザで直接検索結果を開く
    const webUrl = "https://www.xiaohongshu.com/search_result?keyword=" + encodeURIComponent(kw) + "&source=web_search_result_notes";
    const a = document.createElement("a");
    a.href = webUrl;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return;
  }

  // スマホ版：アプリを開く＋キーワードをコピー
  const universalLink = "https://oia.xiaohongshu.com/oia?deeplink=" + encodeURIComponent("xhsdiscover://home");

  const goToApp = ()=>{
    const a = document.createElement("a");
    a.href = universalLink;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  navigator.clipboard.writeText(kw).then(()=>{
    showToast("「" + kw + "」をコピーしました。アプリが開いたら検索欄に貼り付けてください");
    setTimeout(goToApp, 700);
  }).catch(()=>{
    goToApp();
  });
}

function copyText(text, chipEl){
  const t = firstZh(text);
  navigator.clipboard.writeText(t).then(()=>{
    chipEl.classList.add("copied");
    showToast("コピーしました: " + t);
    setTimeout(()=>chipEl.classList.remove("copied"), 900);
  }).catch(()=>{ showToast("コピーに失敗しました"); });
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove("show"), 1400);
}

// ==== 複合キーワードビルダー（下部の🧩バー ＋ 上部の検索欄と連動） ====
function syncFilterInputWithCombo(){
  // 複合キーワードの中身を、上部の検索欄に「表示」はするが、
  // これを絞り込み用のクエリとしては使わない（同じカテゴリの他候補も見せたいため）
  // 表示は毎回その時点の簡体字/繁体字トグルに合わせて計算する
  filterInput.value = comboItems.map(key=> firstZh(comboKeyZh(key))).join(" ");
  forceShowAll = false;
}
function addToCombo(catId, zh){
  const key = comboKey(catId, zh);
  if(!comboItems.includes(key)) comboItems.push(key);
  syncFilterInputWithCombo();
  renderAll();
}
function removeFromCombo(key){
  comboItems = comboItems.filter(x=> x!==key);
  syncFilterInputWithCombo();
  renderAll();
}
function clearCombo(){
  comboItems = [];
  syncFilterInputWithCombo();
  renderAll();
}

function matchesQuery(item, tokens){
  if(!tokens.length) return true;
  return tokens.some(tok=>
    item.zh.toLowerCase().includes(tok) || (item.ja||"").toLowerCase().includes(tok)
  );
}

// ---- 検索欄の直下に出す「日本語訳ヒント」用: zh(中国語)→ja(日本語)の逆引きマップ ----
function buildZhToJaMap(){
  const map = new Map();
  DATA.forEach(cat=> cat.items.forEach(item=>{
    if(!item.ja) return;
    const candidates = item.zh.split("/").flatMap(s=> s.split("、")).map(s=> s.trim().toLowerCase()).filter(Boolean);
    candidates.forEach(c=>{ if(!map.has(c)) map.set(c, item.ja); });
  }));
  return map;
}
const ZH_TO_JA = buildZhToJaMap();

function updateTranslationHint(){
  const hintEl = document.getElementById("translationHint");
  if(!hintEl) return;
  let translations = [];
  if(comboItems.length){
    comboItems.forEach(key=>{
      const word = firstZh(comboKeyZh(key)).toLowerCase();
      const ja = ZH_TO_JA.get(word);
      if(ja && !translations.includes(ja)) translations.push(ja);
    });
  } else {
    const tokens = filterInput.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    tokens.forEach(tok=>{
      let ja = ZH_TO_JA.get(tok);
      if(!ja){
        for(const [k, v] of ZH_TO_JA){
          if(k.includes(tok)){ ja = v; break; }
        }
      }
      if(ja && !translations.includes(ja)) translations.push(ja);
    });
  }
  hintEl.textContent = translations.length ? "🇯🇵 " + translations.slice(0, 6).join("・") : "";
}

function renderAll(){
  catContainer.innerHTML = "";
  let totalShown = 0;

  const tokens = currentQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  updateTranslationHint();

  // カテゴリも選ばれておらず、検索語も入力されていない初期状態では、
  // 下の一覧は何も表示せず、案内メッセージだけを出す（縦幅を節約するため）
  if(currentCatFilters.length === 0 && tokens.length === 0 && comboItems.length === 0 && !forceShowAll){
    noResult.style.display = "block";
    noResult.textContent = "📂 上のカテゴリから選ぶか、キーワードを検索してください";
    countBadge.textContent = "";
    renderCombo();
    return;
  }
  noResult.textContent = "該当するキーワードが見つかりません";

  // 選択中のカテゴリがあれば、それらを先頭に並べ替える（他のカテゴリも引き続きすべて表示する）
  let categories = getAllCategories();
  if(currentCatFilters.length > 0){
    const priority = [];
    const rest = [];
    categories.forEach(cat=>{
      (currentCatFilters.includes(cat.id) ? priority : rest).push(cat);
    });
    categories = [...priority, ...rest];
  }

  categories.forEach(cat=>{
    const isPriorityCat = currentCatFilters.includes(cat.id);
    const hasComboItem = cat.items.some(it=> comboItems.includes(comboKey(cat.id, it.zh)));

    let matched;
    if(tokens.length > 0){
      // 手動でテキスト検索している場合は、通常どおりテキストに一致する項目だけに絞る
      matched = cat.items.filter(it=> matchesQuery(it, tokens));
    } else if(isPriorityCat || hasComboItem || forceShowAll){
      // カテゴリ選択中、または➕で選んだ項目を含むカテゴリは、他の候補も含めて全件表示する
      matched = cat.items;
    } else {
      // 関係のないカテゴリはまだ表示しない
      matched = [];
    }
    if(matched.length === 0) return;

    // ➕で選んだ項目（複合キーワードに入っているもの）を、同じカテゴリ内の先頭に並べ替える
    // それ以外の項目は元の順序のまま、その後ろに続けて全て表示する
    matched = [...matched].sort((a, b)=>{
      const aSel = comboItems.includes(comboKey(cat.id, a.zh));
      const bSel = comboItems.includes(comboKey(cat.id, b.zh));
      if(aSel === bSel) return 0;
      return aSel ? -1 : 1;
    });

    const section = document.createElement("section");
    section.className = "cat" + (isPriorityCat ? " priority-cat" : "");
    section.id = "cat-" + cat.id;

    const h2 = document.createElement("h2");
    h2.textContent = cat.title;
    section.appendChild(h2);

    if(cat.desc){
      const desc = document.createElement("p");
      desc.className = "desc"; desc.textContent = cat.desc;
      section.appendChild(desc);
    }

    const chipsWrap = document.createElement("div");
    chipsWrap.className = "chips";

    const isCollapsible = COLLAPSIBLE_CATEGORIES.has(cat.id) && tokens.length === 0 && !hasComboItem && !forceShowAll;
    const showLimit = CATEGORY_SHOW_LIMIT[cat.id] || 10;
    const isExpanded = expandedCategories[cat.id] || false;
    const itemsToShow = (isCollapsible && !isExpanded) ? matched.slice(0, showLimit) : matched;

    itemsToShow.forEach(item=> chipsWrap.appendChild(createChip(item, cat.id)));
    section.appendChild(chipsWrap);
    totalShown += itemsToShow.length;

    if(isCollapsible && matched.length > showLimit){
      const toggleBtn = document.createElement("button");
      toggleBtn.className = "toggle-more-btn";
      toggleBtn.textContent = isExpanded ? "▲ 閉じる" : `▼ すべて見る（残り${matched.length - showLimit}件）`;
      toggleBtn.addEventListener("click", ()=>{
        expandedCategories[cat.id] = !isExpanded;
        renderAll();
      });
      section.appendChild(toggleBtn);
    }

    catContainer.appendChild(section);
  });

  noResult.style.display = totalShown === 0 ? "block" : "none";
  countBadge.textContent = totalShown > 0 ? `${totalShown}件のキーワードを表示中` : "";
  renderCombo();
}

// ==== 階層カテゴリナビ（大カテゴリ→小カテゴリ） ====
function buildGroupNav(){
  groupList.innerHTML = "";
  GROUPS.forEach(group=>{
    const wrap = document.createElement("div");

    const btn = document.createElement("button");
    btn.className = "group-btn";
    btn.innerHTML = `<span>${group.label}</span><span class="arrow">▶</span>`;
    wrap.appendChild(btn);

    const subList = document.createElement("div");
    subList.className = "subcat-list";

    group.catIds.forEach(catId=>{
      const cat = DATA.find(c=> c.id === catId);
      if(!cat) return;
      const subBtn = document.createElement("button");
      subBtn.textContent = cat.groupLabel || cat.title;
      if(currentCatFilters.includes(catId)) subBtn.classList.add("active");
      subBtn.addEventListener("click", ()=>{
        toggleCategoryFilter(catId);
        subBtn.classList.toggle("active", currentCatFilters.includes(catId));
      });
      subList.appendChild(subBtn);
    });

    btn.addEventListener("click", ()=>{
      const isOpen = subList.classList.toggle("open");
      btn.classList.toggle("open", isOpen);
    });

    wrap.appendChild(subList);
    groupList.appendChild(wrap);
  });
}

function updateActiveFilterDisplay(){
  if(currentCatFilters.length === 0){
    activeFilterChip.classList.remove("show");
    return;
  }
  const labels = currentCatFilters.map(id=>{
    const cat = DATA.find(c=> c.id === id);
    return cat ? (cat.groupLabel || cat.title) : id;
  });
  activeFilterLabel.textContent = "📂 " + labels.join("、") + " を先頭に表示中（他も表示されています）";
  activeFilterChip.classList.add("show");
}

// カテゴリ選択 → 選択のたびに追加/解除するトグル式（複数選択可）
function toggleCategoryFilter(catId){
  const idx = currentCatFilters.indexOf(catId);
  if(idx >= 0){
    currentCatFilters.splice(idx, 1);
  } else {
    currentCatFilters.push(catId);
    forceShowAll = false;
  }
  updateActiveFilterDisplay();
  renderAll();
  if(currentCatFilters.length > 0){
    document.querySelector(".nav-box").scrollIntoView({behavior:"smooth", block:"start"});
  }
}

function clearCategoryFilter(){
  currentCatFilters = [];
  updateActiveFilterDisplay();
  document.querySelectorAll(".subcat-list button.active").forEach(b=> b.classList.remove("active"));
  renderAll();
}

activeFilterClearBtn.addEventListener("click", clearCategoryFilter);

// ==== テキスト検索欄 ====
filterInput.addEventListener("input", ()=>{
  currentQuery = filterInput.value;
  forceShowAll = false;
  if(currentQuery.trim()){
    // テキスト入力があればカテゴリ絞り込みは解除して自由検索を優先
    if(currentCatFilters.length > 0) clearCategoryFilter();
  }
  renderAll();
});

function updatePlaceholder(){
  filterInput.placeholder = zhVariant === "trad"
    ? "キーワード検索（例：聯名・快閃店）"
    : "キーワード検索（例：联名・快闪店）";
}

document.getElementById("topSearchBtn").addEventListener("click", ()=>{
  // 複合キーワードが積まれている場合はそれを結合した語で検索する（スペースなしで連結）
  if(comboItems.length){
    openSearch(comboItems.map(key=> firstZh(comboKeyZh(key))).join(""));
    return;
  }
  const q = filterInput.value.trim();
  if(q) openSearch(q.replace(/\s+/g, ""));
  else showToast("検索したいキーワードを入力してください");
});

document.getElementById("topResetBtn").addEventListener("click", ()=>{
  filterInput.value = "";
  currentQuery = "";
  comboItems = [];
  forceShowAll = false;
  clearCategoryFilter();
  renderAll();
});

document.getElementById("topCopyBtn").addEventListener("click", ()=>{
  // 複合キーワードがあればそれを連結した語を、なければ検索欄の内容をコピーする
  const text = comboItems.length
    ? comboItems.map(key=> firstZh(comboKeyZh(key))).join("")
    : filterInput.value.trim().replace(/\s+/g, "");
  if(!text){
    showToast("コピーしたいキーワードを入力してください");
    return;
  }
  navigator.clipboard.writeText(text).then(()=>{
    showToast("「" + text + "」をコピーしました");
  }).catch(()=>{
    showToast("コピーに失敗しました");
  });
});

// ==== 複合キーワードビルダー（IP + 月 + 接尾辞） ====
const bIp = document.getElementById("bIp");
const bMonth = document.getElementById("bMonth");
const bSuffix = document.getElementById("bSuffix");
const bPreview = document.getElementById("bPreview");

const IP_OPTIONS = [
  { zh:"", ja:"指定なし" },
  { zh:"ckw", ja:"ちいかわ" },
  { zh:"宝可梦 / 寶可夢", ja:"ポケモン" },
  { zh:"三丽鸥 / 三麗鷗", ja:"サンリオ" },
  { zh:"迪士尼", ja:"ディズニー" },
  { zh:"哈利波特", ja:"ハリー・ポッター" },
  { zh:"第五人格", ja:"第五人格" },
  { zh:"名侦探柯南 / 名偵探柯南", ja:"名探偵コナン" },
  { zh:"偶像梦幻祭 / 偶像夢幻祭", ja:"あんスタ" },
  { zh:"原神", ja:"原神" },
];
const SUFFIX_OPTIONS = [
  { zh:"联名汇总 / 聯名匯總", ja:"コラボまとめ" },
  { zh:"近期联名汇总 / 近期聯名匯總", ja:"最近のまとめ" },
  { zh:"联名 / 聯名", ja:"コラボ" },
  { zh:"新品", ja:"新商品" },
  { zh:"合集", ja:"まとめ" },
];

function renderBuilderOptions(){
  const prevIp = bIp.value, prevSuffix = bSuffix.value;
  bIp.innerHTML = "";
  IP_OPTIONS.forEach(opt=>{
    const word = firstZh(opt.zh);
    const el = document.createElement("option");
    el.value = word;
    el.textContent = word ? `${word}（${opt.ja}）` : opt.ja;
    bIp.appendChild(el);
  });
  bSuffix.innerHTML = "";
  SUFFIX_OPTIONS.forEach(opt=>{
    const word = firstZh(opt.zh);
    const el = document.createElement("option");
    el.value = word;
    el.textContent = `${word}（${opt.ja}）`;
    bSuffix.appendChild(el);
  });
  // 表記トグルで選択中の値が変わっても、同じ項目を選び直す
  if(prevIp !== undefined) bIp.value = prevIp || bIp.value;
  if(prevSuffix !== undefined) bSuffix.value = prevSuffix || bSuffix.value;
  updateBuilderPreview();
}

for(let m=1; m<=12; m++){
  const opt = document.createElement("option");
  opt.value = m + "月";
  opt.textContent = m + "月";
  bMonth.appendChild(opt);
}
const nowMonth = new Date().getMonth() + 1;
bMonth.value = nowMonth + "月";
const noneOpt = document.createElement("option");
noneOpt.value = ""; noneOpt.textContent = "指定なし";
bMonth.insertBefore(noneOpt, bMonth.firstChild);
bMonth.value = nowMonth + "月";

function updateBuilderPreview(){
  const combo = [bIp.value, bMonth.value, bSuffix.value].filter(Boolean).join("");
  bPreview.textContent = combo || "—";
}
[bIp, bMonth, bSuffix].forEach(el=> el.addEventListener("change", updateBuilderPreview));
renderBuilderOptions();

document.getElementById("bSearchBtn").addEventListener("click", ()=>{
  const combo = [bIp.value, bMonth.value, bSuffix.value].filter(Boolean).join("");
  if(combo) openSearch(combo);
  else showToast("IP・月・種類のいずれかを選んでください");
});

document.getElementById("bResetBtn").addEventListener("click", ()=>{
  bIp.value = "";
  bMonth.value = nowMonth + "月";
  bSuffix.value = firstZh(SUFFIX_OPTIONS[0].zh);
  updateBuilderPreview();
});

document.getElementById("bCopyBtn").addEventListener("click", ()=>{
  const text = bPreview.textContent === "—" ? "" : bPreview.textContent;
  if(!text){
    showToast("コピーしたいキーワードを組み立ててください");
    return;
  }
  navigator.clipboard.writeText(text).then(()=>{
    showToast("「" + text + "」をコピーしました");
  }).catch(()=>{
    showToast("コピーに失敗しました");
  });
});

document.querySelectorAll(".variant-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    zhVariant = btn.dataset.variant;
    document.querySelectorAll(".variant-btn").forEach(b=> b.classList.toggle("active", b===btn));
    updatePlaceholder();
    renderBuilderOptions();
    if(comboItems.length){
      // 選択済みの複合キーワードがある場合は、検索欄の表示も新しい表記に更新する
      filterInput.value = comboItems.map(key=> firstZh(comboKeyZh(key))).join(" ");
    }
    renderAll();
  });
});

// ==== 初期描画 ====
updatePlaceholder();
buildGroupNav();
renderAll();
</script>
